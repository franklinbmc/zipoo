<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
  <meta name="msapplication-config" content="/browserconfig.xml">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Zipoo app router.">
  <title>Zipoo</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f6f8fc;
      color: #12233f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 24px;
      text-align: center;
    }

    p {
      margin: 8px 0 0;
      color: #6b7280;
      font-weight: 700;
    }
  </style>
  <script>
    (() => {
      const routeToApp = () => {
        let isLoggedIn = false;

        try {
          isLoggedIn = localStorage.getItem("zipoo.isLoggedIn") === "true";
        } catch {
          isLoggedIn = false;
        }

        window.location.replace(isLoggedIn ? "/dashboard" : "/login");
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", routeToApp, { once: true });
      } else {
        routeToApp();
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>Opening Zipoo</h1>
    <p>If this takes longer than a moment, use <a href="/login">login</a>.</p>
  </main>
  <noscript>
    <p>JavaScript is required to open Zipoo.</p>
    <p><a href="/login">Go to login</a></p>
  </noscript>
</body>
</html>
