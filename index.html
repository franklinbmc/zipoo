<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FC">
  <meta name="description" content="Zipoo app router.">
  <title>Zipoo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f6f8fc;
      color: #12233f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 24px;
      text-align: center;
    }

    p {
      margin: 8px 0 0;
      color: #6b7280;
      font-weight: 700;
    }
  </style>
  <script>
    (() => {
      const routeToApp = () => {
        let isLoggedIn = false;

        try {
          isLoggedIn = localStorage.getItem("zipoo.isLoggedIn") === "true";
        } catch {
          isLoggedIn = false;
        }

        window.location.replace(isLoggedIn ? "/dashboard" : "/login");
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", routeToApp, { once: true });
      } else {
        routeToApp();
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>Opening Zipoo</h1>
    <p>If this takes longer than a moment, use <a href="/login">login</a>.</p>
  </main>
  <noscript>
    <p>JavaScript is required to open Zipoo.</p>
    <p><a href="/login">Go to login</a></p>
  </noscript>
</body>
</html>
