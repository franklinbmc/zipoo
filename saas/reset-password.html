<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FC">
  <title>Reset Password - Zipoo Admin</title>
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css?v=129">
</head>
<body>
  <div class="saas-shell">
    <header class="topbar saas-topbar">
      <a class="brand" href="/saas/login" aria-label="Zipoo SaaS Admin">
        <span class="brand-mark">Z</span>
        <span class="brand-name">Zipoo Admin</span>
      </a>
    </header>
    <main class="saas-login-main">
      <form class="saas-login-card" action="/api/saas-password-reset.php" method="post" data-saas-reset>
        <span class="eyebrow centered">Password Recovery</span>
        <h1>New Password</h1>
        <input type="hidden" name="action" value="reset">
        <input type="hidden" name="token" data-reset-token>
        <label>
          <span>Password</span>
          <div class="password-field" data-password-field>
            <input type="password" name="password" autocomplete="new-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" data-password-toggle>
              <svg class="icon-eye" viewBox="0 0 512 512" aria-hidden="true">
                <path d="M48 256s76-128 208-128 208 128 208 128-76 128-208 128S48 256 48 256Z" />
                <circle cx="256" cy="256" r="64" />
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 512 512" aria-hidden="true" hidden>
                <path d="M64 64l384 384M48 256s76-128 208-128a212 212 0 0 1 92 21M464 256s-76 128-208 128a212 212 0 0 1-92-21" />
                <path d="M216 216a64 64 0 0 0 80 80" />
              </svg>
            </button>
          </div>
        </label>
        <label>
          <span>Confirm password</span>
          <div class="password-field" data-password-field>
            <input type="password" name="confirm_password" autocomplete="new-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" data-password-toggle>
              <svg class="icon-eye" viewBox="0 0 512 512" aria-hidden="true">
                <path d="M48 256s76-128 208-128 208 128 208 128-76 128-208 128S48 256 48 256Z" />
                <circle cx="256" cy="256" r="64" />
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 512 512" aria-hidden="true" hidden>
                <path d="M64 64l384 384M48 256s76-128 208-128a212 212 0 0 1 92 21M464 256s-76 128-208 128a212 212 0 0 1-92-21" />
                <path d="M216 216a64 64 0 0 0 80 80" />
              </svg>
            </button>
          </div>
        </label>
        <p class="inline-error" hidden data-saas-error></p>
        <p class="inline-success" hidden data-saas-success></p>
        <button class="btn btn-primary full" type="submit">Update Password</button>
        <a class="auth-secondary-link" href="/saas/login">Back to login</a>
      </form>
    </main>
  </div>
  <script src="/assets/js/saas.js?v=24" defer></script>
</body>
</html>
