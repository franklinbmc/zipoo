  <title>SaaS Admin Login - Zipoo</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=155">
</head>
<body>
  <div class="saas-shell">
    <header class="topbar saas-topbar">
      <a class="brand" href="/saas/" aria-label="Zipoo SaaS Admin">
        <span class="brand-mark">Z</span>
        <span class="brand-name">Zipoo Admin</span>
      </a>
    </header>
    <main class="saas-login-main">
      <form class="saas-login-card" action="/api/saas-login.php" method="post" data-saas-login>
        <span class="eyebrow centered">Internal Platform</span>
        <h1>SaaS Admin</h1>
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>
          <span>Password</span>
          <div class="password-field" data-password-field>
            <input type="password" name="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" data-password-toggle>
              <svg class="icon-eye" viewBox="0 0 512 512" aria-hidden="true">
                <path d="M48 256s76-128 208-128 208 128 208 128-76 128-208 128S48 256 48 256Z" />
                <circle cx="256" cy="256" r="64" />
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 512 512" aria-hidden="true" hidden>
                <path d="M64 64l384 384M48 256s76-128 208-128a212 212 0 0 1 92 21M464 256s-76 128-208 128a212 212 0 0 1-92-21" />
                <path d="M216 216a64 64 0 0 0 80 80" />
              </svg>
            </button>
          </div>
        </label>
        <p class="inline-error" hidden data-saas-error></p>
        <button class="btn btn-primary full" type="submit">Login</button>
        <a class="auth-secondary-link" href="/saas/forgot-password">Forgot password?</a>
      </form>
    </main>
  </div>
  <script src="/assets/js/saas.js?v=28" defer></script>
</body>
</html>
