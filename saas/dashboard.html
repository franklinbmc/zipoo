<body>
  <div class="saas-admin-layout">
    <aside class="saas-sidebar">
      <div class="saas-sidebar-head">
        <a class="brand" href="/saas/dashboard">
          <span class="brand-mark">Z</span>
          <span class="brand-name">Zipoo Admin</span>
        </a>
        <button class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" data-sidebar-toggle>
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <path d="M328 112L184 256l144 144" />
          </svg>
        </button>
      </div>
      <nav class="saas-nav">
        <a class="active" href="/saas/dashboard"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M80 220l176-140 176 140v212H304V304h-96v128H80z" /></svg><span>Dashboard</span></a>
        <a href="/saas/businesses"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M96 144l160-64 160 64-160 64zM96 144v224l160 64 160-64V144M256 208v224" /></svg><span>Businesses</span></a>
        <a href="/saas/users"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M176 240a72 72 0 1 0 0-144 72 72 0 0 0 0 144ZM64 432c16-80 72-128 112-128s96 48 112 128M352 224a56 56 0 1 0 0-112M320 304c48 8 84 48 96 112" /></svg><span>Users</span></a>
        <a href="/saas/plans"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M96 160h320M128 96h256M128 224h256M160 288h192M192 352h128" /></svg><span>Plans</span></a>
        <a href="/saas/billing"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M96 144h320v224H96zM96 208h320M160 304h80M304 304h48" /></svg><span>Billing</span></a>
        <a href="/saas/settings"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M256 176a80 80 0 1 0 0 160 80 80 0 0 0 0-160ZM96 256h48M368 256h48M256 96v48M256 368v48M143 143l34 34M335 335l34 34M369 143l-34 34M177 335l-34 34" /></svg><span>System Settings</span></a>
        <a href="#"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M128 96h256v320H128zM176 160h160M176 224h160M176 288h112" /></svg><span>Audit Logs</span></a>
      </nav>
    </aside>
    <main class="saas-content">
      <header class="saas-content-header">
        <div>
          <span class="eyebrow">Platform</span>
          <h1>SaaS Dashboard</h1>
        </div>
        <div class="admin-actions">
          <button class="admin-icon-action" type="button" aria-label="Toggle dark mode" data-theme-toggle>
            <svg class="theme-sun" viewBox="0 0 512 512" aria-hidden="true">
              <path d="M256 112V48M256 464v-64M400 256h64M48 256h64M358 154l45-45M109 403l45-45M358 358l45 45M109 109l45 45" />
              <circle cx="256" cy="256" r="82" />
            </svg>
            <svg class="theme-moon" viewBox="0 0 512 512" aria-hidden="true" hidden>
              <path d="M336 448c-102 0-184-82-184-184 0-76 46-141 112-169-8 24-9 50-2 76 22 83 107 132 190 110-12 95-93 167-116 167Z" />
            </svg>
          </button>
          <div class="admin-notifications" data-notifications>
            <button class="admin-icon-action" type="button" aria-label="Open notifications" aria-expanded="false" data-notifications-toggle>
              <svg viewBox="0 0 512 512" aria-hidden="true">
                <path d="M176 416h160M208 416a48 48 0 0 0 96 0M112 384h288l-32-48V224a112 112 0 0 0-224 0v112z" />
              </svg>
              <span></span>
            </button>
            <div class="notification-panel" hidden data-notifications-panel>
              <strong>Notifications</strong>
              <p>No new notifications.</p>
            </div>
          </div>
          <div class="admin-user-menu" data-admin-menu>
            <button class="admin-avatar" type="button" aria-label="Open admin menu" aria-expanded="false" data-admin-menu-toggle>
              ZA
            </button>
            <div class="admin-menu-panel" hidden data-admin-menu-panel>
              <a href="#">My Profile</a>
              <a href="#">Change Password</a>
              <a href="/saas/settings">Settings</a>
              <button type="button" data-saas-logout>Logout</button>
            </div>
          </div>
        </div>
      </header>
      <section class="saas-metrics" data-saas-metrics>
        <article><span>Total Businesses</span><strong data-metric="totalBusinesses">0</strong></article>
        <article><span>Active Businesses</span><strong data-metric="activeBusinesses">0</strong></article>
        <article><span>Inactive Businesses</span><strong data-metric="inactiveBusinesses">0</strong></article>
        <article><span>Total Users</span><strong data-metric="totalUsers">0</strong></article>
        <article><span>New Registrations</span><strong data-metric="newRegistrations">0</strong></article>
      </section>
      <section class="saas-table-wrap">
        <div class="saas-section-head">
          <h2>Recent Businesses</h2>
          <input type="search" placeholder="Search businesses" data-business-search>
        </div>
        <div class="saas-table" data-business-list></div>
      </section>
    </main>
  </div>
  <script src="/assets/js/saas.js?v=27" defer></script>
</body>
</html>
