<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FC">
  <title>Forgot Password - Zipoo Admin</title>
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css?v=129">
</head>
<body>
  <div class="saas-shell">
    <header class="topbar saas-topbar">
      <a class="brand" href="/saas/login" aria-label="Zipoo SaaS Admin">
        <span class="brand-mark">Z</span>
        <span class="brand-name">Zipoo Admin</span>
      </a>
    </header>
    <main class="saas-login-main">
      <form class="saas-login-card" action="/api/saas-password-reset.php" method="post" data-saas-forgot>
        <span class="eyebrow centered">Password Recovery</span>
        <h1>Reset Access</h1>
        <input type="hidden" name="action" value="request">
        <label>
          <span>Admin email</span>
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <p class="inline-error" hidden data-saas-error></p>
        <p class="inline-success" hidden data-saas-success></p>
        <button class="btn btn-primary full" type="submit">Send Reset Link</button>
        <a class="auth-secondary-link" href="/saas/login">Back to login</a>
      </form>
    </main>
  </div>
  <script src="/assets/js/saas.js?v=25" defer></script>
</body>
</html>
