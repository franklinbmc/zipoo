<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FC">
  <meta name="description" content="Manage Zipoo system users and team members.">
  <title>System Users - Zipoo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.svg">
  <link rel="stylesheet" href="/assets/css/styles.css?v=66">
</head>
<body>
  <div class="app-shell customers-page-shell">
    <header class="topbar app-topbar inner-topbar">
      <a class="icon-button" href="/settings" aria-label="Back to settings">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M328 112L184 256l144 144" />
        </svg>
      </a>
      <h1>System Users</h1>
      <button class="icon-button" type="button" data-open-create-user aria-label="Add user">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M256 112v288M112 256h288" />
        </svg>
      </button>
    </header>

    <main class="customers-page" data-company-users-page>
      <div class="customers-search-wrap">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M221.09 64a157.09 157.09 0 10157.09 157.09A157.1 157.1 0 00221.09 64zM338.29 338.29L448 448" />
        </svg>
        <input type="search" class="customers-search-input" data-company-users-search placeholder="Search users by name, phone, email, role...">
      </div>

      <div class="settings-list flush-list company-users-list" data-company-users-list style="display: grid; gap: 8px;"></div>

      <div class="company-users-empty" hidden data-company-users-empty style="text-align: center; padding: 48px 16px; background: #fff; border: 1px solid var(--color-line); border-radius: 12px;">
        <svg class="svg-ico empty-ico" viewBox="0 0 512 512" aria-hidden="true"><path d="M176 232a68 68 0 100-136 68 68 0 000 136M56 440c14-76 64-128 120-128s106 52 120 128M344 216a52 52 0 100-104M328 312c44 8 80 48 92 120" /></svg>
        <h3 style="margin: 0 0 6px; color: var(--color-navy); font-size: 1.15rem; font-weight: 800;">No team users yet</h3>
        <p style="margin: 0 0 16px; color: var(--color-muted); font-size: 0.9rem;">Add cashiers, managers, or staff members to give them access to this business.</p>
        <button class="btn btn-primary btn-sm" type="button" data-open-create-user>Add User</button>
      </div>
    </main>
  </div>

  <!-- User Details Modal -->
  <div class="fullscreen-modal" hidden data-user-detail-modal>
    <section class="fullscreen-panel" role="dialog" aria-modal="true" aria-labelledby="user-detail-title">
      <header class="fullscreen-header">
        <button class="icon-button" type="button" data-user-detail-close aria-label="Close">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M112 112l288 288M400 112L112 400" /></svg>
        </button>
        <h2 id="user-detail-title">User Details</h2>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>
      <div class="fullscreen-body customer-detail-body">
        <div class="customer-detail-hero">
          <div class="customer-avatar" data-user-detail-avatar>U</div>
          <h3 data-user-detail-name>-</h3>
          <span class="customer-meta" data-user-detail-meta>-</span>
        </div>

        <div class="settings-list flush-list" style="border: 1px solid var(--color-line); border-radius: 12px; margin-top: 14px;">
          <div class="settings-list-row field-display-row">
            <span>Role</span>
            <strong data-user-detail-role style="text-transform: capitalize;">-</strong>
          </div>
          <div class="settings-list-row field-display-row">
            <span>Status</span>
            <strong data-user-detail-status>-</strong>
          </div>
          <div class="settings-list-row field-display-row">
            <span>Phone</span>
            <strong data-user-detail-phone>-</strong>
          </div>
          <div class="settings-list-row field-display-row">
            <span>Email</span>
            <strong data-user-detail-email>-</strong>
          </div>
          <div class="settings-list-row field-display-row">
            <span>Added on</span>
            <strong data-user-detail-created-at>-</strong>
          </div>
        </div>

        <div class="customer-detail-actions" style="margin-top: 24px; display: grid; gap: 10px;">
          <button class="btn btn-primary full" type="button" data-user-detail-edit-btn>Edit user</button>
          <button class="btn btn-danger-outline full" type="button" data-user-detail-delete-btn>Delete user</button>
        </div>
      </div>
    </section>
  </div>

  <!-- User Create Modal -->
  <div class="fullscreen-modal" hidden data-user-create-modal>
    <section class="fullscreen-panel" role="dialog" aria-modal="true" aria-labelledby="user-create-title">
      <header class="fullscreen-header">
        <button class="icon-button" type="button" data-user-create-close aria-label="Close">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M112 112l288 288M400 112L112 400" /></svg>
        </button>
        <h2 id="user-create-title">Add System User</h2>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>
      <form class="fullscreen-body" data-user-create-form novalidate>
        <label class="form-field">
          <span>Full Name <strong style="color: var(--color-danger, #ef4444);">*</strong></span>
          <input type="text" name="full_name" placeholder="e.g. Baraka Juma" required>
        </label>
        <label class="form-field">
          <span>Phone Number (Login username) <strong style="color: var(--color-danger, #ef4444);">*</strong></span>
          <input type="tel" name="phone" placeholder="e.g. 0712345678" required>
        </label>
        <label class="form-field">
          <span>Email Address</span>
          <input type="email" name="email" placeholder="e.g. baraka@company.com">
        </label>
        <label class="form-field">
          <span>User Role <strong style="color: var(--color-danger, #ef4444);">*</strong></span>
          <select name="role" required>
            <option value="cashier">Cashier / Sales</option>
            <option value="manager">Manager</option>
            <option value="staff" selected>General Staff</option>
            <option value="storekeeper">Storekeeper / Inventory</option>
            <option value="accountant">Accountant</option>
          </select>
        </label>
        <label class="form-field">
          <span>Account Password <strong style="color: var(--color-danger, #ef4444);">*</strong></span>
          <input type="password" name="password" placeholder="Minimum 4 characters" minlength="4" required>
        </label>
        <label class="form-field">
          <span>Status</span>
          <select name="status">
            <option value="active" selected>Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </label>
        <p class="inline-error" hidden data-user-create-error></p>
        <button class="btn btn-primary full" type="submit" data-user-create-submit>Create User</button>
      </form>
    </section>
  </div>

  <!-- User Edit Modal -->
  <div class="fullscreen-modal" hidden data-user-edit-modal>
    <section class="fullscreen-panel" role="dialog" aria-modal="true" aria-labelledby="user-edit-title">
      <header class="fullscreen-header">
        <button class="icon-button" type="button" data-user-edit-close aria-label="Close">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M112 112l288 288M400 112L112 400" /></svg>
        </button>
        <h2 id="user-edit-title">Edit System User</h2>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>
      <form class="fullscreen-body" data-user-edit-form novalidate>
        <input type="hidden" name="user_id" data-edit-user-id>
        <label class="form-field">
          <span>Full Name <strong style="color: var(--color-danger, #ef4444);">*</strong></span>
          <input type="text" name="full_name" data-edit-user-fullname required>
        </label>
        <label class="form-field">
          <span>Phone Number <strong style="color: var(--color-danger, #ef4444);">*</strong></span>
          <input type="tel" name="phone" data-edit-user-phone required>
        </label>
        <label class="form-field">
          <span>Email Address</span>
          <input type="email" name="email" data-edit-user-email>
        </label>
        <label class="form-field">
          <span>User Role <strong style="color: var(--color-danger, #ef4444);">*</strong></span>
          <select name="role" data-edit-user-role required>
            <option value="cashier">Cashier / Sales</option>
            <option value="manager">Manager</option>
            <option value="staff">General Staff</option>
            <option value="storekeeper">Storekeeper / Inventory</option>
            <option value="accountant">Accountant</option>
          </select>
        </label>
        <label class="form-field">
          <span>Status</span>
          <select name="status" data-edit-user-status>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </label>
        <label class="form-field">
          <span>New Password (Leave blank to keep existing)</span>
          <input type="password" name="password" placeholder="Enter new password if changing" data-edit-user-password>
        </label>
        <p class="inline-error" hidden data-user-edit-error></p>
        <button class="btn btn-primary full" type="submit" data-user-edit-submit>Update User</button>
      </form>
    </section>
  </div>

  <!-- App Notice / Confirm Modal -->
  <div class="modal-backdrop" hidden data-app-modal>
    <section class="app-modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
      <h2 id="app-modal-title" data-app-modal-title>Notice</h2>
      <p data-app-modal-message></p>
      <button class="btn btn-primary full" type="button" data-app-modal-close>OK</button>
    </section>
  </div>

  <script src="/assets/js/app.js?v=87" defer></script>
</body>
</html>
