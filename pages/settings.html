<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F8FC">
  <meta name="description" content="Zipoo account settings.">
  <title>Settings - Zipoo</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.svg">
  <link rel="stylesheet" href="/assets/css/styles.css?v=46">
</head>
<body>
  <div class="app-shell settings-page-shell">
    <header class="topbar app-topbar inner-topbar">
      <a class="icon-button" href="/dashboard" aria-label="Back to dashboard">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path d="M328 112L184 256l144 144" />
        </svg>
      </a>
      <h1>Settings</h1>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <main class="settings-page" data-settings-page>
      <details class="settings-accordion" open>
        <summary>
          <span>Account details</span>
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M184 112l144 144-144 144" /></svg>
        </summary>
        <div class="settings-list flush-list">
          <div class="owner-profile-card">
            <div class="owner-avatar" data-owner-avatar>U</div>
            <div>
              <strong data-owner-profile-name>Owner profile</strong>
              <span data-owner-profile-meta>-</span>
            </div>
          </div>
          <div class="settings-list-row">
            <span>Business name</span>
            <strong data-settings-business-name>-</strong>
          </div>
          <button class="settings-list-row" type="button" data-account-edit="full_name">
            <span>Name</span>
            <strong data-settings-name>-</strong>
            <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M410.3 231.1L280.9 101.7 85.3 297.3c-4.6 4.6-7.8 10.4-9.1 16.8L56 416l101.9-20.2c6.4-1.3 12.2-4.5 16.8-9.1l195.6-195.6zM326.6 56l129.4 129.4" /></svg>
          </button>
          <button class="settings-list-row" type="button" data-account-edit="phone">
            <span>Phone</span>
            <strong data-settings-phone>-</strong>
            <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M410.3 231.1L280.9 101.7 85.3 297.3c-4.6 4.6-7.8 10.4-9.1 16.8L56 416l101.9-20.2c6.4-1.3 12.2-4.5 16.8-9.1l195.6-195.6zM326.6 56l129.4 129.4" /></svg>
          </button>
          <button class="settings-list-row" type="button" data-account-edit="email">
            <span>Email</span>
            <strong data-settings-email>-</strong>
            <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M410.3 231.1L280.9 101.7 85.3 297.3c-4.6 4.6-7.8 10.4-9.1 16.8L56 416l101.9-20.2c6.4-1.3 12.2-4.5 16.8-9.1l195.6-195.6zM326.6 56l129.4 129.4" /></svg>
          </button>
          <button class="settings-list-row" type="button" data-business-manager-open>
            <span>Current serving business</span>
            <strong data-settings-current-business>-</strong>
            <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M184 112l144 144-144 144" /></svg>
          </button>
        </div>
      </details>

      <details class="settings-accordion">
        <summary>
          <span>My Businesses <small data-business-count>0 registered</small></span>
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M184 112l144 144-144 144" /></svg>
        </summary>
        <div class="settings-list flush-list" data-settings-business-list></div>
      </details>
    </main>
  </div>

  <div class="fullscreen-modal" hidden data-account-edit-modal>
    <section class="fullscreen-panel" role="dialog" aria-modal="true" aria-labelledby="account-edit-title">
      <header class="fullscreen-header">
        <button class="icon-button" type="button" data-account-edit-close aria-label="Close">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M112 112l288 288M400 112L112 400" /></svg>
        </button>
        <h2 id="account-edit-title" data-account-edit-title>Edit account</h2>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>
      <form class="fullscreen-body" data-account-edit-form>
        <label class="form-field">
          <span data-account-edit-label>Value</span>
          <input type="text" name="value" data-account-edit-value required>
        </label>
        <div class="otp-grid" hidden data-account-otp-fields>
          <label class="form-field">
            <span>Old verification code</span>
            <input type="text" name="old_otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          </label>
          <label class="form-field">
            <span>New verification code</span>
            <input type="text" name="new_otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          </label>
        </div>
        <p class="inline-error" hidden data-account-edit-error></p>
        <button class="btn btn-primary full" type="submit" data-account-edit-submit>Save</button>
      </form>
    </section>
  </div>

  <div class="fullscreen-modal" hidden data-business-manager-modal>
    <section class="fullscreen-panel" role="dialog" aria-modal="true" aria-labelledby="business-manager-title">
      <header class="fullscreen-header">
        <button class="icon-button" type="button" data-business-manager-close aria-label="Close">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M112 112l288 288M400 112L112 400" /></svg>
        </button>
        <h2 id="business-manager-title">My Businesses</h2>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>
      <div class="fullscreen-body">
        <div class="settings-list flush-list" data-business-manager-list></div>
        <div class="business-create-trigger-wrapper">
          <button class="btn btn-primary full btn-with-icon" type="button" data-open-create-business>
            <svg viewBox="0 0 512 512" aria-hidden="true">
              <path d="M256 112v288M112 256h288" />
            </svg>
            <span>Create new business</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <div class="fullscreen-modal" hidden data-business-create-modal>
    <section class="fullscreen-panel" role="dialog" aria-modal="true" aria-labelledby="business-create-title">
      <header class="fullscreen-header">
        <button class="icon-button" type="button" data-business-create-close aria-label="Close">
          <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M112 112l288 288M400 112L112 400" /></svg>
        </button>
        <h2 id="business-create-title">Create Business</h2>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>
      <div class="fullscreen-body fullscreen-flow-body">
        <form class="entry-login register-flow business-create-flow" action="/api/businesses.php" method="post" novalidate data-business-create-flow>
          <div class="flow-progress" aria-label="Creation progress">
            <span class="flow-dot active"></span>
            <span class="flow-dot"></span>
            <span class="flow-dot"></span>
            <span class="flow-dot"></span>
          </div>
          <span class="flow-count" data-create-flow-count>1 / 4</span>
          <span class="eyebrow centered" data-create-flow-eyebrow>Business Information</span>
          <h2 class="flow-title" data-create-flow-title>Name your business</h2>
          <p class="flow-helper" data-create-flow-helper>Enter the official trading name of your business.</p>

          <!-- Step 1: Business Name -->
          <label class="flow-field active" data-create-flow-field>
            <span>Business Name</span>
            <input type="text" name="business_name" placeholder="e.g. Mwenge Supermarket" autocomplete="organization" required>
          </label>

          <!-- Step 2: Business Type (Search Select) -->
          <label class="flow-field" data-create-flow-field hidden>
            <span>Business Type</span>
            <div class="search-select" data-search-select data-create-business-type>
              <input type="hidden" name="business_type" value="service" required data-search-select-value>
              <button class="search-select-trigger" type="button" data-search-select-trigger aria-expanded="false">
                <span data-search-select-label>Service</span>
                <svg viewBox="0 0 512 512" aria-hidden="true">
                  <path d="M112 184l144 144 144-144" />
                </svg>
              </button>
              <div class="search-select-panel" hidden data-search-select-panel>
                <input type="search" data-search-select-search placeholder="Search business type">
                <div class="search-select-options" data-search-select-options>
                  <button type="button" data-search-select-option data-value="retail">Retail</button>
                  <button type="button" data-search-select-option data-value="service" class="active">Service</button>
                  <button type="button" data-search-select-option data-value="wholesale">Wholesale</button>
                </div>
              </div>
            </div>
          </label>

          <!-- Step 3: Region (Search Select) -->
          <label class="flow-field" data-create-flow-field hidden>
            <span>Region</span>
            <div class="search-select" data-search-select data-create-location="region">
              <input type="hidden" name="region" required data-search-select-value>
              <button class="search-select-trigger" type="button" data-search-select-trigger aria-expanded="false">
                <span data-search-select-label>Select Region</span>
                <svg viewBox="0 0 512 512" aria-hidden="true">
                  <path d="M112 184l144 144 144-144" />
                </svg>
              </button>
              <div class="search-select-panel" hidden data-search-select-panel>
                <input type="search" data-search-select-search placeholder="Search region">
                <div class="search-select-options" data-search-select-options></div>
              </div>
            </div>
          </label>

          <!-- Step 4: District (Search Select) -->
          <label class="flow-field" data-create-flow-field hidden>
            <span>District</span>
            <div class="search-select" data-search-select data-create-location="district">
              <input type="hidden" name="district" required data-search-select-value>
              <button class="search-select-trigger" type="button" data-search-select-trigger aria-expanded="false" disabled>
                <span data-search-select-label>Select District</span>
                <svg viewBox="0 0 512 512" aria-hidden="true">
                  <path d="M112 184l144 144 144-144" />
                </svg>
              </button>
              <div class="search-select-panel" hidden data-search-select-panel>
                <input type="search" data-search-select-search placeholder="Search district">
                <div class="search-select-options" data-search-select-options></div>
              </div>
            </div>
          </label>

          <p class="inline-error" hidden data-create-flow-error></p>

          <div class="flow-actions first-step">
            <button class="btn btn-secondary icon-only" type="button" data-create-flow-back aria-label="Go back" hidden>
              <svg viewBox="0 0 512 512" aria-hidden="true">
                <path d="M328 112L184 256l144 144" />
              </svg>
            </button>
            <button class="btn btn-primary btn-with-icon" type="button" data-create-flow-next>
              <span data-create-flow-next-label>Next</span>
              <svg viewBox="0 0 512 512" aria-hidden="true">
                <path d="M184 112l144 144-144 144" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" hidden data-app-modal>
    <section class="app-modal" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
      <h2 id="app-modal-title" data-app-modal-title>Notice</h2>
      <p data-app-modal-message></p>
      <button class="btn btn-primary full" type="button" data-app-modal-close>OK</button>
    </section>
  </div>

  <script src="/assets/js/app.js?v=47" defer></script>
</body>
</html>
